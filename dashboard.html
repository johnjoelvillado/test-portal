<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Include Flatpickr CSS for the calendar widget -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Right Profile Bar */
        .header-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 30px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .profile-widget {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-details {
            text-align: right;
            line-height: 1.3;
        }

        .profile-details .name {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .profile-details .meta {
            font-size: 13px;
            color: #666;
        }

        /* Center Dashboard Content Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: fit-content;
            max-width: none;
        }

        /* Card Header Layout */
        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .action-group {
            display: flex;
            gap: 10px;
        }

        h2 {
            margin: 0;
            color: #333;
        }

        /* Transaction Type Selector Dropdown */
        .transaction-type-select {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            outline: none;
            cursor: pointer;
        }

        .transaction-type-select:focus {
            border-color: #007bff;
        }

        /* Action Buttons */
        .clear-btn,
        .export-btn {
            padding: 6px 12px;
            background: #e9ecef;
            color: #333;
            border: 1px solid #ced4da;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .clear-btn:hover,
        .export-btn:hover {
            background: #dee2e6;
        }

        .export-btn {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .export-btn:hover {
            background: #218838;
        }

        /* Responsive Scrollable Table Wrapper */
        .table-responsive {
            width: fit-content;
            overflow-x: auto;
            max-height: 70vh;
            border: 1px solid #eee;
            border-radius: 4px;
            max-width: 85vw;
        }

        /* CSS Grid Table Architecture */
        .grid-table {
            display: grid;
        }

        .grid-header {
            display: contents;
        }

        .grid-cell {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            white-space: nowrap;
            background-color: white;
        }

        .grid-header .grid-cell {
            background-color: #f8f9fa;
            color: #333;
            font-weight: bold;
            text-transform: capitalize;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #ccc;
            vertical-align: top;
        }

        /* Per-Column Header Layout */
        .header-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }

        .column-search-input,
        .date-input,
        .numeric-range-input {
            padding: 5px 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            outline: none;
            font-weight: normal;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }

        .column-search-input:focus,
        .date-input:focus,
        .numeric-range-input:focus {
            border-color: #007bff;
        }

        /* Numeric Range Container */
        .numeric-range-container {
            display: flex;
            gap: 4px;
        }

        .numeric-range-container input {
            width: 50%;
        }

        /* Date Input Wrapper with individual clear button */
        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .date-input-wrapper input {
            width: 100%;
            padding-right: 24px;
        }

        .clear-date-btn {
            position: absolute;
            right: 6px;
            background: none;
            border: none;
            font-size: 14px;
            color: #999;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            display: none;
        }

        .clear-date-btn:hover {
            color: #333;
        }

        /* Buttons */
        .logout-btn {
            padding: 8px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #5a6268;
        }

        .loading-text,
        .error-text {
            text-align: center;
            padding: 20px;
            color: #666;
            white-space: normal;
            grid-column: 1 / -1;
        }

        .error-text {
            color: #dc3545;
        }
    </style>
</head>

<body>
    <!-- Top Right Profile Bar -->
    <header class="header-bar">
        <div class="profile-widget">
            <div class="profile-details">
                <div class="name" id="nameDisplay">Loading...</div>
                <div class="meta"><span id="roleDisplay">Role</span> | <span id="accountCodeDisplay">Code</span></div>
            </div>
            <button class="logout-btn" id="logoutBtn">Log Out</button>
        </div>
    </header>

    <!-- Center Dashboard Content Area -->
    <div class="main-container">
        <div class="card">
            <div class="card-header-flex">
                <div class="title-group">
                    <h2>Transaction Records</h2>
                    <!-- Transaction Type Dropdown -->
                    <select id="transactionTypeSelect" class="transaction-type-select">
                        <option value="wallet">Wallet Transactions</option>
                        <option value="xure_credits">Xure Credits Transactions</option>
                    </select>
                </div>
                <div class="action-group">
                    <button class="export-btn" id="exportExcelBtn">Export to Excel</button>
                    <button class="clear-btn" id="clearSearchBtn">Clear All Filters</button>
                </div>
            </div>

            <!-- Scrollable wrapper to safely fit wide data sets -->
            <div class="table-responsive">
                <div class="grid-table" id="dynamicGridTable">
                    <div class="grid-header" id="tableHeaderRow">
                        <!-- Dynamic columns injected here -->
                    </div>
                    <div id="tableBody" style="display: contents;">
                        <div class="grid-cell loading-text">Loading data from server...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Flatpickr JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- Include SheetJS (xlsx) Library for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        let allTransactions = [];
        let filteredTransactions = []; // Tracks currently displayed/filtered records
        let columns = [];
        const dateColumns = new Set();
        const numericColumns = new Set();
        const calendarInstances = {};

        // 1. Authentication Check & Base URL Retrieval
        const token = localStorage.getItem('token');
        const apiBaseUrl = localStorage.getItem('apiBaseUrl');

        if (!token || !apiBaseUrl) {
            localStorage.clear();
            window.location.href = 'index.html';
        } else {
            const userData = localStorage.getItem('userData');
            if (userData) {
                const user = JSON.parse(userData);
                document.getElementById('nameDisplay').innerText = `${user.firstname} ${user.lastname}`;
                document.getElementById('roleDisplay').innerText = user.role;
                document.getElementById('accountCodeDisplay').innerText = user.account_code;
            }
        }

        // Helper: Categorize columns into Dates, Numbers, or text search
        function classifyColumns(data, cols) {
            dateColumns.clear();
            numericColumns.clear();

            cols.forEach(col => {
                const lowerCol = col.toLowerCase();

                if (lowerCol.includes('date') || lowerCol.includes('created_at') || lowerCol.includes('updated_at') || lowerCol === 'timestamp' || lowerCol.endsWith('_at')) {
                    dateColumns.add(col);
                    return;
                }

                let numericCount = 0;
                let totalValid = 0;
                for (let i = 0; i < Math.min(data.length, 10); i++) {
                    const val = data[i][col];
                    if (val !== null && val !== undefined && val !== '') {
                        totalValid++;
                        if (!isNaN(Number(val))) {
                            numericCount++;
                        }
                    }
                }

                if (totalValid > 0 && (numericCount / totalValid) >= 0.8) {
                    numericColumns.add(col);
                }
            });
        }

        // Render rows helper function
        function renderTableRows(dataToRender) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            filteredTransactions = dataToRender; // Save reference for Excel export

            if (!dataToRender || dataToRender.length === 0) {
                tableBody.innerHTML = `<div class="grid-cell loading-text">No matching records found.</div>`;
                return;
            }

            dataToRender.forEach(rowItem => {
                columns.forEach(col => {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.innerText = rowItem[col] !== null && rowItem[col] !== undefined ? rowItem[col] : '';
                    tableBody.appendChild(cell);
                });
            });
        }

        // Filter computation checking text, date ranges, or numeric ranges per column
        function applyColumnFilters() {
            const textFilters = {};
            const dateFilters = {};
            const numericFilters = {};

            columns.forEach(col => {
                if (dateColumns.has(col)) {
                    const input = document.getElementById(`search_${col}`);
                    if (input && input.value) {
                        const dates = input.value.split(" to ");
                        dateFilters[col] = {
                            from: dates[0] || '',
                            to: dates[1] || dates[0]
                        };
                    }
                } else if (numericColumns.has(col)) {
                    const minInput = document.getElementById(`search_${col}_min`);
                    const maxInput = document.getElementById(`search_${col}_max`);
                    const minVal = minInput ? minInput.value.trim() : '';
                    const maxVal = maxInput ? maxInput.value.trim() : '';

                    if (minVal !== '' || maxVal !== '') {
                        numericFilters[col] = {
                            min: minVal !== '' ? Number(minVal) : null,
                            max: maxVal !== '' ? Number(maxVal) : null
                        };
                    }
                } else {
                    const input = document.getElementById(`search_${col}`);
                    if (input) {
                        const val = input.value.toLowerCase().trim();
                        if (val !== '') {
                            textFilters[col] = val;
                        }
                    }
                }
            });

            const hasTextFilters = Object.keys(textFilters).length > 0;
            const hasDateFilters = Object.keys(dateFilters).length > 0;
            const hasNumericFilters = Object.keys(numericFilters).length > 0;

            if (!hasTextFilters && !hasDateFilters && !hasNumericFilters) {
                renderTableRows(allTransactions);
                return;
            }

            const filteredData = allTransactions.filter(rowItem => {
                // Validate Text Filters
                for (const col in textFilters) {
                    const cellValue = rowItem[col];
                    const query = textFilters[col];
                    if (cellValue === null || cellValue === undefined || !String(cellValue).toLowerCase().includes(query)) {
                        return false;
                    }
                }

                // Validate Date Range Filters
                for (const col in dateFilters) {
                    const cellValue = rowItem[col];
                    const { from, to } = dateFilters[col];

                    if (!cellValue) return false;

                    const cellDate = new Date(cellValue);
                    if (isNaN(cellDate.getTime())) return false;
                    cellDate.setHours(0, 0, 0, 0);

                    if (from) {
                        const fromDate = new Date(from);
                        fromDate.setHours(0, 0, 0, 0);
                        if (cellDate < fromDate) return false;
                    }

                    if (to) {
                        const toDate = new Date(to);
                        toDate.setHours(0, 0, 0, 0);
                        if (cellDate > toDate) return false;
                    }
                }

                // Validate Numeric Range Filters
                for (const col in numericFilters) {
                    const cellValue = rowItem[col];
                    const { min, max } = numericFilters[col];

                    if (cellValue === null || cellValue === undefined || cellValue === '') return false;
                    const numVal = Number(cellValue);
                    if (isNaN(numVal)) return false;

                    if (min !== null && numVal < min) return false;
                    if (max !== null && numVal > max) return false;
                }

                return true;
            });

            renderTableRows(filteredData);
        }

        // 2. Fetch Dynamic Table Data via POST Request using dynamic Base URL
        async function loadTableData() {
            const tableHeaderRow = document.getElementById('tableHeaderRow');
            const tableBody = document.getElementById('tableBody');
            const gridTable = document.getElementById('dynamicGridTable');
            const selectedType = document.getElementById('transactionTypeSelect').value;

            tableBody.innerHTML = `<div class="grid-cell loading-text">Loading data from server...</div>`;

            try {
                const apiTableUrl = `${apiBaseUrl}/GetPortalTransactions`;

                const response = await fetch(apiTableUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        transaction_type: selectedType
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch table data from server.');
                }

                const result = await response.json();
                allTransactions = Array.isArray(result) ? result : (result.data || result.rows);

                if (!allTransactions || allTransactions.length === 0) {
                    tableHeaderRow.innerHTML = '';
                    gridTable.style.gridTemplateColumns = '1fr';
                    tableBody.innerHTML = `<div class="grid-cell loading-text">No data available.</div>`;
                    filteredTransactions = [];
                    return;
                }

                // Extract columns and classify them
                columns = Object.keys(allTransactions[0]);
                classifyColumns(allTransactions, columns);

                gridTable.style.gridTemplateColumns = columns.map(() => 'minmax(min-content, max-content)').join(' ');

                // Generate Dynamic Headers
                tableHeaderRow.innerHTML = '';
                columns.forEach(col => {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    const formattedColName = col.replace(/_/g, ' ');

                    if (dateColumns.has(col)) {
                        cell.innerHTML = `
                            <div class="header-content">
                                <span>${formattedColName}</span>
                                <div class="date-input-wrapper">
                                    <input type="text" id="search_${col}" class="date-input" placeholder="Select date or range..." autocomplete="off">
                                    <button type="button" id="clear_date_${col}" class="clear-date-btn" title="Clear date">&times;</button>
                                </div>
                            </div>
                        `;
                    } else if (numericColumns.has(col)) {
                        cell.innerHTML = `
                            <div class="header-content">
                                <span>${formattedColName}</span>
                                <div class="numeric-range-container">
                                    <input type="number" id="search_${col}_min" class="numeric-range-input" placeholder="Min" autocomplete="off">
                                    <input type="number" id="search_${col}_max" class="numeric-range-input" placeholder="Max" autocomplete="off">
                                </div>
                            </div>
                        `;
                    } else {
                        cell.innerHTML = `
                            <div class="header-content">
                                <span>${formattedColName}</span>
                                <input type="text" id="search_${col}" class="column-search-input" placeholder="Search..." autocomplete="off">
                            </div>
                        `;
                    }

                    tableHeaderRow.appendChild(cell);
                });

                // Attach event listeners and controls
                columns.forEach(col => {
                    if (dateColumns.has(col)) {
                        const inputEl = document.getElementById(`search_${col}`);
                        const clearBtnEl = document.getElementById(`clear_date_${col}`);
                        inputEl.addEventListener('click', (e) => e.stopPropagation());

                        calendarInstances[col] = flatpickr(inputEl, {
                            mode: "range",
                            dateFormat: "Y-m-d",
                            onChange: function (selectedDates, dateStr) {
                                clearBtnEl.style.display = dateStr ? 'block' : 'none';
                                applyColumnFilters();
                            }
                        });

                        clearBtnEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            calendarInstances[col].clear();
                            inputEl.value = '';
                            clearBtnEl.style.display = 'none';
                            applyColumnFilters();
                        });
                    } else if (numericColumns.has(col)) {
                        const minEl = document.getElementById(`search_${col}_min`);
                        const maxEl = document.getElementById(`search_${col}_max`);

                        minEl.addEventListener('input', applyColumnFilters);
                        maxEl.addEventListener('input', applyColumnFilters);
                        minEl.addEventListener('click', (e) => e.stopPropagation());
                        maxEl.addEventListener('click', (e) => e.stopPropagation());
                    } else {
                        const inputEl = document.getElementById(`search_${col}`);
                        inputEl.addEventListener('click', (e) => e.stopPropagation());
                        inputEl.addEventListener('input', applyColumnFilters);
                    }
                });

                // Initial Render of Rows
                renderTableRows(allTransactions);

            } catch (error) {
                console.error('Error loading table:', error);
                tableBody.innerHTML = `<div class="grid-cell error-text">Could not load table data.</div>`;
            }
        }

        // Trigger table data load on page startup
        loadTableData();

        // Reload data when transaction type changes
        document.getElementById('transactionTypeSelect').addEventListener('change', () => {
            loadTableData();
        });

        // 3. Export to Excel Functionality
        document.getElementById('exportExcelBtn').addEventListener('click', () => {
            if (!filteredTransactions || filteredTransactions.length === 0) {
                alert('No data available to export.');
                return;
            }

            // Create a worksheet from the filtered dataset
            const worksheet = XLSX.utils.json_to_sheet(filteredTransactions);

            // Create a new workbook and append the worksheet
            const workbook = XLSX.utils.book_new();
            const selectedType = document.getElementById('transactionTypeSelect').value;
            XLSX.utils.book_append_sheet(workbook, worksheet, "Transactions");

            // Trigger file download
            XLSX.writeFile(workbook, `Transaction_Records_${selectedType}.xlsx`);
        });

        // 4. Clear All Filters Functionality
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            columns.forEach(col => {
                if (dateColumns.has(col)) {
                    const input = document.getElementById(`search_${col}`);
                    if (input) input.value = '';
                    if (calendarInstances[col]) calendarInstances[col].clear();
                    const clearBtn = document.getElementById(`clear_date_${col}`);
                    if (clearBtn) clearBtn.style.display = 'none';
                } else if (numericColumns.has(col)) {
                    const minInput = document.getElementById(`search_${col}_min`);
                    const maxInput = document.getElementById(`search_${col}_max`);
                    if (minInput) minInput.value = '';
                    if (maxInput) maxInput.value = '';
                } else {
                    const input = document.getElementById(`search_${col}`);
                    if (input) input.value = '';
                }
            });
            renderTableRows(allTransactions);
        });

        // 5. Logout functionality (clears all session items including apiBaseUrl)
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
