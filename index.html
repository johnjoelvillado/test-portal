<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f9;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        .card h2 {
            margin-top: 0;
            color: #333;
        }

        label {
            font-size: 0.85rem;
            color: #666;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            color: red;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="baseUrl">Passkey</label>
            <input type="text" id="baseUrl" placeholder="Passkey" required autocomplete="off">

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Sign In</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        // Ensure the Base URL field starts blank on every load
        document.getElementById('baseUrl').value = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const baseUrlInput = atob(document.getElementById('baseUrl').value).trim().replace(/\/+$/, '');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            // Save Base URL to localStorage so it stays active until logout
            localStorage.setItem('apiBaseUrl', baseUrlInput);

            messageEl.style.color = "blue";
            messageEl.innerText = "Logging in...";

            try {
                const response = await fetch(`${baseUrlInput}/LoginPortalAccount`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const rawText = await response.text();
                let resultData;

                try {
                    resultData = JSON.parse(rawText);
                } catch (e) {
                    resultData = rawText;
                }

                if (response.ok) {
                    if (typeof resultData === 'object' && resultData !== null) {
                        localStorage.setItem('token', resultData.token || '');
                        localStorage.setItem('userData', JSON.stringify(resultData));
                        window.location.href = 'dashboard.html';
                    } else {
                        throw new Error(resultData);
                    }
                } else {
                    const errorMsg = (typeof resultData === 'object') ? (resultData.error || resultData.message) : resultData;
                    throw new Error(errorMsg);
                }

            } catch (error) {
                console.error('API Error:', error);
                messageEl.style.color = "red";
                messageEl.innerText = error.message || "Something went wrong";
            }
        });
    </script>
</body>

</html>
