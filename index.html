<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #message { color: red; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p id="message"></p>
    </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        messageEl.style.color = "blue";
        messageEl.innerText = "Logging in...";

        try {
            console.log('parameter:', JSON.stringify({ username, password }));
            const response = await fetch('https://24c1tkvfsa.execute-api.ap-southeast-1.amazonaws.com/xdeal/LoginPortalAccount', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            console.log('API reponse:', data);
            if (response.ok) {
                if (typeof data === 'object' && data !== null) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('token', data.token || ''); 
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error(data);
                }
            } else {
                messageEl.style.color = "red";
                messageEl.innerText = data.error || "Invalid username or password";
            }
        } catch (error) {
            console.error('API Error:', error);
            messageEl.style.color = "red";
            messageEl.innerText = "Network error. Could not connect to server.";
        }
    });
</script>
</body>
</html>
